<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found</title>
  <!-- NOTE: paths here MUST be root-absolute. GitHub Pages serves this same file for
       a miss at any depth (/a/b/c/), so relative paths would resolve wrongly.
       If this site is a PROJECT page (username.github.io/REPO/), prefix them: /REPO/ -->
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/img/header_img.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hubot+Sans:wght@400;500;600;700;800&family=Mona+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  color-scheme: light;
  --bg: #efeae0;
  --fg: #16181c;
  --fg-muted: #5a5f69;
  --border: #14141338;
  --accent: #c5311f;
  --font-display: "Hubot Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --font-body: "Mona Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #1c1c1e;
  --fg: #f2f3f5;
  --fg-muted: #9ca0a8;
  --border: #f2f3f53d;
  --accent: #ff5b50;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px;
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--fg);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 520px; text-align: center; }
.code {
  font-family: var(--font-display);
  font-size: clamp(64px, 18vw, 128px);
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  color: var(--accent);
  margin: 0;
}
h1 {
  font-family: var(--font-display);
  font-size: clamp(20px, 4vw, 28px);
  font-weight: 700;
  letter-spacing: -0.02em;
  margin: 16px 0 8px;
}
p { color: var(--fg-muted); margin: 0 0 28px; }
a.home {
  display: inline-block;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 15px;
  color: var(--fg);
  text-decoration: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 22px;
  transition: border-color .15s ease, color .15s ease;
}
a.home:hover { border-color: var(--accent); color: var(--accent); }
  </style>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (!t) t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
</head>
<body>
  <main class="wrap">
    <p class="code">404</p>
    <h1>This page does not exist</h1>
    <p>The link may be out of date, or the write-up may have moved.</p>
    <a class="home" href="/">Back to the archive</a>
  </main>
</body>
</html>
